<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Name</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Hero Section -->
  <header class="text-center py-5 bg-light">
    <h1>Restaurant Name</h1>
    <p>Delicious food delivered with love</p>
    <a href="#menu" class="btn btn-primary">View Menu</a>
  </header>

  <!-- About Section -->
  <section id="about" class="container py-5">
    <h2>About Us</h2>
    <p>Short description about the restaurant here.</p>
  </section>

  <!-- Menu Section -->
  <section id="menu" class="container py-5">
    <h2>Our Menu</h2>
    <div class="row">
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="images/dish1.jpg" class="card-img-top" alt="Dish Name">
          <div class="card-body">
            <h5 class="card-title">Dish Name</h5>
            <p class="card-text">$12.99</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="container py-5">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Name" class="form-control mb-3">
      <input type="email" placeholder="Email" class="form-control mb-3">
      <textarea placeholder="Message" class="form-control mb-3"></textarea>
      <button class="btn btn-primary">Send</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="text-center py-3 bg-dark text-white">
    &copy; 2026 Restaurant Name. All rights reserved.
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
